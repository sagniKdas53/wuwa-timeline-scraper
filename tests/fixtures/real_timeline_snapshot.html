imer\":\"The script does not edit your files, it simply extracts your Convene History URL from your log files.\",\"email_link_description\":\"This will enable us to save your data to our database \u0026 automatically back up your data every time you import. If your player ID is already linked to another email address, we will remove the old link and use your new email address.\"},\"planner\":{\"move_to_top\":\"Move To Top\",\"move_up\":\"Move Up\",\"move_down\":\"Move Down\",\"move_to_bottom\":\"Move To Bottom\"},\"inventory\":{\"new_plan\":\"New Plan\",\"add_plan\":\"Add Plan\",\"material_summary\":\"Material Summary\",\"no_active_plans\":\"You don't have any active plans.\",\"nodes_to_unlock\":\"Nodes to Unlock\",\"passive_skill\":\"Passive Skill\",\"plan_delete_name_confirm\":\"Are you sure you want to delete the {name} plan?\",\"no_items_will_be_consumed\":\"No items will be consumed.\",\"attributes\":{\"ascension_level\":\"Ascension Level\",\"level\":\"Level\",\"basic_attack\":\"Basic Attack\",\"resonance_skill\":\"Resonance Skill\",\"forte_circuit\":\"Forte Circuit\",\"resonance_liberation\":\"Resonance Liberation\",\"intro_skill\":\"Intro Skill\"}},\"home_page\":{\"hero_heading\":\"Your Wuthering Waves Resource\",\"hero_cta_button\":\"Start Tracking\",\"keep_up_with_the_latest_news\":\"Keep up with the latest news\",\"quick_links\":\"Quick Links\",\"quick_links_description\":\"Access important pages and features quickly\",\"the_curent_events_and_activities\":\"The current events and activities\",\"frequently_asked_questions\":{\"title\":\"Frequently Asked Questions\",\"description\":\"Find answers to common questions about WuWa Tracker\",\"still_need_help\":\"Still need help?\",\"join_our_discord\":\"Join our Discord Server and ask for help there\",\"item_1\":{\"title\":\"Is WuWa Tracker safe to use?\",\"content_1\":\"WuWa Tracker has been \u003clink\u003eoperating since May 30, 2024\u003c/link\u003e without any reported account issues from our users. We simply read your Convene URL, which is the same web page the game uses to display your pull history. We will \u003cstrong\u003enever\u003c/strong\u003e ask for your Wuthering Waves login credentials.\",\"content_2\":\"Your data remains on your device unless you choose to sync across devices by linking an email to your UID. Only anonymized global statistics are collected whenever you import. We recommend you review our \u003cprivacy\u003ePrivacy Policy\u003c/privacy\u003e and \u003cterms\u003eTerms of Service\u003c/terms\u003e before using our site.\"},\"item_2\":{\"title\":\"What devices and regions are supported?\",\"content_1\":\"Currently, our \u003clink\u003eimport tutorial\u003c/link\u003e supports all major devices and platforms including: Windows, macOS, Linux, Android, iOS, and PlayStation 5. Furthermore, we support imports using open-source automated scripts or via manual file upload methods with step-by-step video tutorials.\",\"content_2\":\"We support all game regions and servers including: America, Asia, Europe, SEA, HK/TW/MO, and CN.\"},\"item_3\":{\"title\":\"How do I import or export my data?\",\"content\":\"You may import or export your data using your \u003clink\u003eData Settings\u003c/link\u003e. We recommend you export your data regularly as a backup and save it in multiple locations.\"},\"item_4\":{\"title\":\"How do I sync across devices?\",\"content_1\":\"Your UID must be linked to an email address in order to sync your data across multiple devices. You must first login to your email account via our social providers (such as Google or GitHub), then you can link your email from the \u003cconnections\u003eConnections Settings\u003c/connections\u003e or by enabling an email link while following our \u003cimport\u003eImport Tutorial\u003c/import\u003e.\",\"content_2\":\"Your pull data will automatically sync whenever you import or manually press the {recoverPulls} button via your \u003clink\u003eConnections Settings\u003c/link\u003e.\"},\"item_5\":{\"title\":\"How do I fix my import issues?\",\"content_1\":\"Most import issues can be resolved by following our \u003clink\u003eImport Troubleshooting Guide\u003c/link\u003e, which covers common issues and step-by-step solutions.\",\"content_2\":\"If you're still having trouble, feel free to reach out on our \u003clink\u003eDiscord server\u003c/link\u003e for further assistance.\"},\"item_6\":{\"title\":\"Can I recover pulls older than 6 months?\",\"content_1\":\"If you've previously imported your data to WuWa Tracker, your older pulls are already backed up to your UID. You can recover them anytime via your \u003clink\u003eConnections Settings\u003c/link\u003e after linking your email to your UID.\",\"content_2\":\"Otherwise, unfortunately, if this is your first time using our site, we can only access what's currently available in your in-game history. Pulls older than 6 months are no longer retrievable due to Kuro Games' retention policy.\"},\"item_7\":{\"title\":\"Why are some of my statistics inaccurate?\",\"content\":\"Some statistics like luck ratings and global statistics are cached on our server to improve performance. After importing new pulls, it may take a few minutes for these values to update. Try refreshing the page or checking back after a few hours.\"}}},\"banners\":{\"save_as_image\":\"Save as Image\",\"newest_first\":\"Newest First\",\"since_last_appearance\":\"Since Last Appearance\"},\"timers\":{\"reset_timers\":{\"weekly_reset\":\"Weekly Reset\",\"daily_reset\":\"Daily Reset\"},\"waveplates\":{\"stamina\":\"Waveplates\",\"stamina_extra\":\"Waveplate Crystals\"}}},\"metadata\":{\"root\":{\"title\":\"Wuthering Waves Resource \u0026 Companion App\",\"description\":\"WuWa Tracker is the #1 Wuthering Waves pull tracker \u0026 pity counter. Track your pulls and achievements, view global luck stats, use our ascension planner \u0026 calculator, and explore guides, wiki, and news articles to optimize your Wuthering Waves experience.\"},\"achievements\":{\
